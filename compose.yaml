services:
  agent:
    build: .
    image: agent:local
    restart: unless-stopped
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AGENT_ADDR: 0.0.0.0:8080
      AGENT_DATA_DIR: /app/data/agent
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:-}
      AGENT_SKILLS_DIR: /app/skills
      AGENT_MCP_CONFIG_PATH: /app/config/mcp.json
      AGENT_LLM_PROVIDER: ${AGENT_LLM_PROVIDER:-none}
      AGENT_LLM_MODEL: ${AGENT_LLM_MODEL:-}
      AGENT_LLM_BASE_URL: ${AGENT_LLM_BASE_URL:-}
      AGENT_LLM_API_KEY: ${AGENT_LLM_API_KEY:-}
      AGENT_LLM_CONTEXT_WINDOW: ${AGENT_LLM_CONTEXT_WINDOW:-32768}
      AGENT_LLM_MAX_TOKENS: ${AGENT_LLM_MAX_TOKENS:-4096}
      AGENT_REQUEST_BODY_LIMIT_BYTES: ${AGENT_REQUEST_BODY_LIMIT_BYTES:-2097152}
      AGENT_MAX_MESSAGE_CHARS: ${AGENT_MAX_MESSAGE_CHARS:-20000}
      AGENT_RUN_TIMEOUT_MS: ${AGENT_RUN_TIMEOUT_MS:-120000}
      AGENT_MAX_TURNS: ${AGENT_MAX_TURNS:-10}
      AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-30}
      AGENT_MAX_ACTIVE_SESSIONS: ${AGENT_MAX_ACTIVE_SESSIONS:-50}
      AGENT_IDLE_TIMEOUT_MS: ${AGENT_IDLE_TIMEOUT_MS:-900000}
      AGENT_SYSTEM_PROMPT: ${AGENT_SYSTEM_PROMPT:-}
      BUSINESS_MCP_TOKEN: ${BUSINESS_MCP_TOKEN:-}
      RAG_API_TOKEN: ${RAG_API_TOKEN:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
    volumes:
      - agent-data:/app/data
      - ${AGENT_MCP_CONFIG_FILE:-./config/mcp.example.json}:/app/config/mcp.json:ro
      - ./skills:/app/skills:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  agent-data:
