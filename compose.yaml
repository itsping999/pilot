services:
  knowledge-pilot:
    build: .
    image: knowledge-pilot:local
    restart: unless-stopped
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      KNOWLEDGE_PILOT_ADDR: 0.0.0.0:8080
      KNOWLEDGE_PILOT_DB_PATH: /var/lib/knowledge-pilot/data/knowledge-pilot.db
      KNOWLEDGE_PILOT_REQUEST_BODY_LIMIT_BYTES: 2097152
      KNOWLEDGE_PILOT_CHUNK_SIZE: 800
      KNOWLEDGE_PILOT_CHUNK_OVERLAP: 120
      KNOWLEDGE_PILOT_EMBEDDING_PROVIDER: ollama
      KNOWLEDGE_PILOT_EMBEDDING_BASE_URL: http://host.docker.internal:11434
      KNOWLEDGE_PILOT_EMBEDDING_PATH: /api/embed
      KNOWLEDGE_PILOT_EMBEDDING_MODEL: qwen3-embedding:0.6b
      KNOWLEDGE_PILOT_LLM_PROVIDER: ${KNOWLEDGE_PILOT_LLM_PROVIDER:-none}
      KNOWLEDGE_PILOT_LLM_BASE_URL: ${KNOWLEDGE_PILOT_LLM_BASE_URL:-}
      KNOWLEDGE_PILOT_LLM_MODEL: ${KNOWLEDGE_PILOT_LLM_MODEL:-}
      KNOWLEDGE_PILOT_LLM_API_KEY: ${KNOWLEDGE_PILOT_LLM_API_KEY:-}
      KNOWLEDGE_PILOT_UI_ENABLED: "true"
      RUST_LOG: info
    volumes:
      - knowledge-pilot-data:/var/lib/knowledge-pilot/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  knowledge-pilot-data:
